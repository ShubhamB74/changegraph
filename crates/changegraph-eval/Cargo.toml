[package]
name = "changegraph-eval"
description = "Evaluation and benchmark harness for ChangeGraph (precision/recall, test-selection recall, runtime and memory)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "changegraph_eval"
path = "src/lib.rs"

[[bin]]
name = "changegraph-eval"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
changegraph-core = { path = "../changegraph-core" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
