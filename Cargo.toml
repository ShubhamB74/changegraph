[workspace]
resolver = "2"
members = ["crates/changegraph-core", "crates/changegraph-cli", "crates/changegraph-eval"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/changegraph"

# Versions are caret requirements; Cargo.lock (generated on first build) pins them.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
# tree-sitter is pinned to the 0.24 line: its Node API (e.g. child indices) changed in 0.25.
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
